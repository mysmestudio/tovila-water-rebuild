<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Main swirl gradient -->
    <linearGradient id="swirlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a4698"/>
      <stop offset="30%" stop-color="#0d5ab8"/>
      <stop offset="65%" stop-color="#1976d2"/>
      <stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>

    <!-- Droplet above I gradient -->
    <linearGradient id="dropGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#26c6da"/>
      <stop offset="45%" stop-color="#00a0e9"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>

    <!-- Upper splash wave gradient -->
    <linearGradient id="splashUpperGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="50%" stop-color="#42a5f5"/>
      <stop offset="100%" stop-color="#90caf9"/>
    </linearGradient>

    <!-- Lower splash droplet gradient -->
    <linearGradient id="splashLowerGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1e88e5"/>
    </linearGradient>
  </defs>

  <g id="tovila-swirl">
    <!-- Main circular swoosh/arc wrapping around top and left -->
    <path d="M 342,168 
             C 336,130 290,126 230,140 
             C 165,155 110,205 92,275 
             C 74,345 92,425 155,472 
             C 215,516 300,518 375,476 
             C 415,453 452,416 478,358 
             C 498,312 494,310 472,328 
             C 440,354 402,382 360,392 
             C 295,408 220,388 174,342 
             C 132,300 126,236 156,186 
             C 186,138 245,116 306,124 
             C 334,128 348,142 342,168 Z" 
          fill="url(#swirlGrad)" />

    <!-- Droplet directly above the letter I -->
    <path d="M 342,156 
             C 340,172 328,198 342,216 
             C 352,228 368,228 376,216 
             C 390,198 378,172 342,156 Z" 
          fill="url(#dropGrad)" />

    <!-- Splash wave tail (upper) -->
    <path d="M 370,410 
             C 410,380 460,320 500,320 
             C 515,320 520,335 505,355 
             C 475,395 425,435 370,445 Z" 
          fill="url(#splashUpperGrad)" />

    <!-- Lower splash drop -->
    <path d="M 405,455 
             C 435,445 480,450 515,475 
             C 525,482 518,495 500,495 
             C 460,495 425,480 405,455 Z" 
          fill="url(#splashLowerGrad)" />
  </g>

  <!-- Brand Typography -->
  <g id="tovila-text" text-anchor="middle">
    <!-- TOVILA -->
    <text x="305" y="270" 
          font-family="system-ui, -apple-system, Montserrat, Arial, sans-serif" 
          font-weight="900" 
          font-size="82" 
          letter-spacing="2" 
          fill="#94181b">TOVILA</text>
    
    <!-- WATER -->
    <text x="305" y="325" 
          font-family="system-ui, -apple-system, Montserrat, Arial, sans-serif" 
          font-weight="700" 
          font-size="44" 
          letter-spacing="6" 
          fill="#94181b">WATER</text>

    <!-- SOLUTIONS -->
    <text x="305" y="372" 
          font-family="system-ui, -apple-system, Montserrat, Arial, sans-serif" 
          font-weight="700" 
          font-size="44" 
          letter-spacing="2.5" 
          fill="#94181b">SOLUTIONS</text>
  </g>
</svg>