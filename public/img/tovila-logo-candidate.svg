<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;display=swap");
      .tovila-title {
        font-family: "Montserrat", "Arial Black", -apple-system, sans-serif;
        font-weight: 900;
        font-size: 64px;
        fill: #991b1e;
        letter-spacing: 0.05em;
      }
      .tovila-sub {
        font-family: "Montserrat", -apple-system, sans-serif;
        font-weight: 800;
        font-size: 33px;
        fill: #991b1e;
        letter-spacing: 0.12em;
      }
      .tovila-sub2 {
        font-family: "Montserrat", -apple-system, sans-serif;
        font-weight: 800;
        font-size: 33px;
        fill: #991b1e;
        letter-spacing: 0.03em;
      }
    </style>

    <!-- Linear gradient for main crescent swirl -->
    <linearGradient id="swirlGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#0b3875"/>
      <stop offset="25%" stop-color="#0e4b96"/>
      <stop offset="60%" stop-color="#1565c0"/>
      <stop offset="90%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#42a5f5"/>
    </linearGradient>

    <!-- Droplet radial gradient with glossy light highlight -->
    <radialGradient id="dropGrad" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#80d8ff"/>
      <stop offset="35%" stop-color="#00b0ff"/>
      <stop offset="75%" stop-color="#0277bd"/>
      <stop offset="100%" stop-color="#01579b"/>
    </radialGradient>

    <!-- Upper splash wave gradient -->
    <linearGradient id="splashWave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="45%" stop-color="#42a5f5"/>
      <stop offset="100%" stop-color="#90caf9"/>
    </linearGradient>

    <!-- Lower splash drop gradient -->
    <linearGradient id="splashDrop" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="60%" stop-color="#1976d2"/>
      <stop offset="100%" stop-color="#42a5f5"/>
    </linearGradient>
  </defs>

  <!-- Water Swirl Circle -->
  <g id="water-swoosh">
    <!-- Main Circular Arc sweeping around left and bottom -->
    <path d="M 285 140
             C 275 116, 235 112, 195 125
             C 140 143, 98 188, 83 248
             C 68 310, 85 372, 132 414
             C 178 454, 245 464, 305 442
             C 338 430, 368 408, 392 376
             C 380 382, 362 390, 342 393
             C 285 401, 222 388, 178 350
             C 138 316, 122 264, 135 214
             C 147 168, 185 136, 230 128
             C 260 122, 282 128, 285 140 Z"
          fill="url(#swirlGrad)" />

    <!-- Water Droplet directly over letter I -->
    <!-- Pointed tip at top (285, 140), curving down to rounded plump drop -->
    <path d="M 285 140
             C 285 140, 272 162, 272 171
             C 272 178.5, 277.8 184, 285 184
             C 292.2 184, 298 178.5, 298 171
             C 298 162, 285 140, 285 140 Z"
          fill="url(#dropGrad)" />

    <!-- Upper Wave Splash Wing -->
    <path d="M 315 415
             C 350 405, 385 365, 412 315
             C 421 298, 422 285, 412 280
             C 400 274, 388 285, 375 305
             C 355 336, 335 368, 300 395
             C 292 401, 305 417, 315 415 Z"
          fill="url(#splashWave)" />

    <!-- Lower Splash Droplet -->
    <path d="M 338 402
             C 365 400, 400 408, 432 422
             C 442 426, 444 435, 434 438
             C 415 444, 385 440, 355 428
             C 342 422, 330 412, 338 402 Z"
          fill="url(#splashDrop)" />
  </g>

  <!-- Centered Brand Typography -->
  <g id="brand-text">
    <!-- TOVILA -->
    <text x="246" y="235" text-anchor="middle" class="tovila-title">TOVILA</text>

    <!-- WATER -->
    <text x="246" y="278" text-anchor="middle" class="tovila-sub">WATER</text>

    <!-- SOLUTIONS -->
    <text x="246" y="318" text-anchor="middle" class="tovila-sub2">SOLUTIONS</text>
  </g>
</svg>